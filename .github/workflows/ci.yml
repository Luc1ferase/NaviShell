# Fast checks for every push to master and every pull request.
#
# `frontend` type-checks, lints and builds the web app plus the built-in plugin bundles.
# `rust` checks the Tauri core on all three release platforms. `pnpm build` runs there too
# because `tauri::generate_context!()` needs `dist/` to exist at compile time.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same ref makes the previous run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from the `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build (plugins + app)
        run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `generate_context!()` embeds `frontendDist` (../dist), so build before cargo runs.
      - name: Build frontend
        run: pnpm build

      # The macOS image ships a preinstalled toolchain whose directories make rustup's
      # component rename fail (ENOTEMPTY). Refresh rustup and start from a clean toolchain.
      - name: Reset preinstalled Rust toolchain (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          rustup self update || true
          rustup toolchain uninstall stable || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo check
        if: matrix.os != 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo check --all-targets
