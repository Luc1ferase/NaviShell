# Packaging and GitHub Release.
#
# Triggered by pushing a tag like `v0.1.0` (bump the version in package.json,
# src-tauri/tauri.conf.json and src-tauri/Cargo.toml first) or manually from the Actions tab.
# Every matrix leg uploads its installers to the same *draft* release, which a human then
# reviews and publishes.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# tauri-action creates the release and uploads assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      # One broken platform should not cancel the others' uploads.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-22.04
            args: ''
          - label: Linux arm64
            platform: ubuntu-22.04-arm
            args: ''
          - label: Windows x64
            platform: windows-latest
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both macOS architectures are built on the same runner image.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      # tauri-action runs `beforeBuildCommand` from tauri.conf.json, but the plugin bundles
      # and `dist/` are built explicitly here so a failure is reported as its own step.
      - name: Build frontend
        run: pnpm build

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: NaviShell v__VERSION__
          releaseBody: |
            Download the installer for your platform from the assets below.

            - Windows: `.msi` / `.exe`
            - macOS: `.dmg` (aarch64 for Apple silicon, x64 for Intel)
            - Linux: `.AppImage` and `.deb` (x64 and arm64)

            Built from ${{ github.sha }}.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}
