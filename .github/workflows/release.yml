# Packaging and GitHub Release.
#
# Triggered by pushing a tag like `v0.1.0` (bump the version in package.json,
# src-tauri/tauri.conf.json and src-tauri/Cargo.toml first) or manually from the Actions tab.
# One job creates the *draft* release, every matrix leg uploads its installers into it,
# and a human then reviews and publishes it.
#
# Requires two repository secrets for the update signatures: `TAURI_SIGNING_PRIVATE_KEY`
# and `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`. The draft release MUST be published for the
# in-app updater to see it, since `releases/latest/download/latest.json` only resolves
# once a release is published and not marked as a prerelease.
#
# The updater checks a download against the signature recorded for its platform in
# `latest.json`; the per-file `.sig` assets tauri-action uploads next to the installers
# are copies of the same signatures, so the last job removes them from the draft.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# tauri-action creates the release and uploads assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishing a draft that a manual dispatch produced creates the tag, and that tag push
  # would otherwise start a second, identical build that ends in a duplicate draft. Skip
  # the build when the tag already has a published release.
  guard:
    name: Check for an existing release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Skip tag pushes whose release is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build=true
          if [ "${{ github.event_name }}" = "push" ]; then
            state=$(gh release view "$GITHUB_REF_NAME" --json isDraft               --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo "none")
            if [ "$state" = "published" ]; then
              echo "::notice::$GITHUB_REF_NAME already has a published release; nothing to build."
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # The bundle legs start within the same second, and when each asked tauri-action to
  # create the draft "if none exists" two of them did: the installers - and the updater's
  # `latest.json` - ended up split across two drafts with the same tag. The draft is
  # therefore created here, once, and the legs only upload into it. A draft left by an
  # earlier run of the same version is reused, so a failed leg can simply be rerun.
  draft:
    name: Create the draft release
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find or create the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: |
            Download the installer for your platform from the assets below.

            - Windows: `.msi` / `.exe`
            - macOS: `.dmg` (aarch64 for Apple silicon, x64 for Intel)
            - Linux: `.AppImage`, `.deb` and `.rpm` (x64 and arm64)

            Built from ${{ github.sha }}.
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          # A draft is not reachable through `releases/tags/<tag>`, so list and match.
          matches=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"")
          count=$(printf '%s\n' "$matches" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases carry the tag $tag; delete the stale drafts first"
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            set -- $matches
            if [ "$2" != "true" ]; then
              echo "::error::$tag is already published; bump the version before building"
              exit 1
            fi
            id=$1
            echo "reusing draft $id for $tag"
          else
            id=$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="NaviShell $tag" \
              -f body="$BODY" -F draft=true -F prerelease=false --jq .id)
            echo "created draft $id for $tag"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.label }}
    needs: [guard, draft]
    if: needs.guard.outputs.build == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      # One broken platform should not cancel the others' uploads.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-22.04
            args: ''
          - label: Linux arm64
            platform: ubuntu-22.04-arm
            args: ''
          - label: Windows x64
            platform: windows-latest
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The macOS image ships a preinstalled toolchain whose directories make rustup's
      # component rename fail (ENOTEMPTY). Refresh rustup and start from a clean toolchain.
      - name: Reset preinstalled Rust toolchain (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          rustup self update || true
          rustup toolchain uninstall stable || true

      # Both macOS architectures are built on the same runner image.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      # tauri-action runs `beforeBuildCommand` from tauri.conf.json, but the plugin bundles
      # and `dist/` are built explicitly here so a failure is reported as its own step.
      - name: Build frontend
        run: pnpm build

      # `TAURI_SIGNING_PRIVATE_KEY` / `..._PASSWORD` are the minisign key pair generated
      # with `pnpm tauri signer generate`; its public half is `plugins.updater.pubkey` in
      # tauri.conf.json. Without them the build fails, because `createUpdaterArtifacts`
      # asks for a signature for every bundle.
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the draft the `draft` job made; never create a release here.
          releaseId: ${{ needs.draft.outputs.id }}
          # The in-app updater reads
          # `releases/latest/download/latest.json`, which GitHub only resolves for a
          # published, non-prerelease release. Publishing the draft created here is
          # therefore what actually hands the update to existing installs.
          uploadUpdaterJson: true
          # Windows ships both an .msi and an NSIS setup.exe; the NSIS one is what
          # `installMode: passive` is configured for.
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: ${{ matrix.args }}

  # Every bundle leg uploads `<installer>.sig` next to its installer, but the updater
  # never reads those: it takes the signature from `latest.json` (built from the same
  # files on the runner). Drop them so the asset list is what a person would download.
  tidy:
    name: Remove .sig assets
    needs: [draft, bundle]
    # Runs after the matrix even when a leg failed, so a partial draft is tidied too.
    if: always() && needs.draft.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the signature assets from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.draft.outputs.id }}
        run: |
          gh api "repos/$GH_REPO/releases/$RELEASE/assets?per_page=100" \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$id" --silent
            echo "removed $name"
          done
